[project]
name = "reward-hacking-guardrail"
version = "1.6.1"
description = "Production-grade runtime guardrails, human-in-the-loop governance, and FinOps for autonomous AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "redis>=5.0.8",
  "aiokafka>=0.10.0",
  "prometheus-client>=0.20.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "alembic>=1.13.2",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.20",
  "PyYAML>=6.0.2",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.1"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "aiosqlite>=0.20.0", "import-linter>=2.15,<2.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "B008"]

# v1.6.0 D26: architecture contracts, checked by `lint-imports` (CI and Stage 1).
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Post-execution review and change requests never publish to Kafka, re-dispatch runs or touch token leases (AGENTS.md 2.3, v1.6.1 D43)"
type = "forbidden"
source_modules = [
    "app.services.review_queue",
    "app.services.outcomes",
    "app.services.evaluation",
    "app.services.judge_triage",
    "app.services.review_sampling",
    "app.services.change_requests",
]
forbidden_modules = [
    "app.services.events",
    "app.infra.kafka",
    "app.workers",
    "app.services.finops.leases",
]

[[tool.importlinter.contracts]]
name = "Services do not depend on the HTTP or Dashboard layers"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api", "app.ui"]

[[tool.importlinter.contracts]]
name = "The sandbox package is independent of the HTTP, Dashboard and worker layers"
type = "forbidden"
source_modules = ["app.services.sandbox"]
forbidden_modules = ["app.api", "app.ui", "app.workers"]

[[tool.importlinter.contracts]]
name = "FinOps submodules are layered (higher layers may import lower ones, never the reverse)"
type = "layers"
containers = ["app.services.finops"]
layers = [
    "export",
    "adjustments | reporting",
    "recording",
    "budget_enforcement",
    "leases",
    "forecast",
    "budget_policies",
    "ledger",
    "pricing",
    "serializers",
    "settlement",
    "core",
]
