[project]
name = "reward-hacking-guardrail"
version = "0.1.0"
description = "Agent guardrail skeleton for preventing reward hacking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "redis>=5.0.8",
  "aiokafka>=0.10.0",
  "prometheus-client>=0.20.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "alembic>=1.13.2",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "aiosqlite>=0.20.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
