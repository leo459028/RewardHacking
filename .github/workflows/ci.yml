name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-otel.txt

      - name: Version anchors
        run: python scripts/bump_version.py --check

      - name: Whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          fi

      - name: Lint
        run: ruff check app tests scripts --config pyproject.toml

      - name: Architecture contracts
        run: lint-imports

      - name: Security & Secret Scan
        run: python scripts/security_check.py

      - name: Test
        run: pytest -q -W error::DeprecationWarning

  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build image (not pushed)
        run: docker build -t rewardhacking:ci .

      - name: Scan image content
        run: python scripts/image_content_check.py --image rewardhacking:ci
