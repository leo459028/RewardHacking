# RewardHacking judge profiles (v1.5.11; v1.5.12 activation, fallback, budgets, Anthropic)
#
# Copy to config/judge_profiles.yaml (git-ignored). A judge only orders human review work: it never changes a
# verdict, a review priority or a review status, in any profile.
#
# v1.5.12: no LLM profile is used until it passes a connection test for its exact configuration.
# - Select one with EVALUATION_JUDGE_PROFILE=<name>: the API probes it once in the background at startup and uses it
#   only if the probe succeeds; or
# - test and activate it on /dashboard/judge-profiles (profiles can also be created there).
# Changing base_url, model, the key, structured_output, reasoning_effort, external or max_output_tokens means it must
# be tested again; until then the rule-based judge is used.
#
# Never put a key in this file. Reference the environment variable that holds it with api_key_env, whose name must
# end in _API_KEY (or be listed in EVALUATION_JUDGE_KEY_ENV_ALLOWLIST). A profile containing api_key / token /
# secret fields is rejected at startup. External hosts must use https; cloud metadata addresses are refused.
#
# Optional v1.5.12 fields: fallback (up to 2 profile names, tried when this profile fails or its breaker is open;
# the rule-based judge is always last) and daily_token_cap (tokens per tenant per UTC day for this profile).
#
# Built-in profiles that always exist: "deterministic" and "default" (derived from EVALUATION_JUDGE_*).

profiles:
  # Small local model in LM Studio on the Docker host (Developer tab -> Start Server; use the port LM Studio shows).
  # Containers reach the host through host.docker.internal, which EVALUATION_JUDGE_INTERNAL_HOSTS treats as internal.
  # Reasoning on (recommended for background triage): measured AUROC 0.95 vs 0.60 with reasoning off on 10 seed
  # samples, at ~46 s instead of ~20 s per assessment on CPU. Reasoning shares max_output_tokens with the answer,
  # so leave room for it (~600 tokens were used on average).
  - name: local-small
    provider: openai_compatible
    base_url: http://host.docker.internal:12339/v1   # LM Studio's port (shown under API Usage)
    model: qwen3.5-2b
    structured_output: auto        # tries json_schema, then json_object, then prompt-only JSON
    timeout_seconds: 300
    max_input_chars: 8000
    max_output_tokens: 2000        # reasoning + answer; 300 was fully consumed by reasoning
    execution: background          # outcome submission does not wait for a slow local model
    pricing_provider: qa_local     # add a zero-cost pricing row for this model
    strip_reasoning: true          # drop <think>...</think> before parsing
    fallback: [local-small-fast]   # v1.5.12: used when local-small fails or its breaker is open (must be tested too)

  # Same model with reasoning off: ~2.3x faster but much weaker judgement (near chance on the 10-sample test).
  # LM Studio ignores /no_think and enable_thinking=false; only reasoning_effort: none disables reasoning.
  - name: local-small-fast
    provider: openai_compatible
    base_url: http://host.docker.internal:12339/v1
    model: qwen3.5-2b
    structured_output: auto
    timeout_seconds: 90
    max_input_chars: 8000
    max_output_tokens: 300
    execution: background
    pricing_provider: qa_local
    reasoning_effort: none

  # Larger local model (14B / 27B) served by Ollama, llama.cpp or vLLM.
  - name: local-large
    provider: openai_compatible
    base_url: http://host.docker.internal:11434/v1
    model: qwen2.5:14b-instruct
    structured_output: auto
    timeout_seconds: 180
    max_input_chars: 16000
    max_output_tokens: 400
    execution: background
    pricing_provider: qa_local

  # Cloud API through Gemini's OpenAI-compatible endpoint. Requires GEMINI_API_KEY in the environment,
  # EVALUATION_JUDGE_ALLOW_EXTERNAL=true and the tenant's consent to external judges.
  - name: gemini-flash
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    external: true
    structured_output: json_schema
    timeout_seconds: 20
    max_input_chars: 24000
    max_output_tokens: 600
    max_retries: 2
    execution: inline
    pricing_provider: google
    daily_token_cap: 200000        # v1.5.12: per tenant per day for this profile (on top of the global cap)

  # v1.5.12 native Anthropic Messages API (x-api-key, anthropic-version 2026-10-21, output_config.format JSON schema).
  # Requires ANTHROPIC_API_KEY, EVALUATION_JUDGE_ALLOW_EXTERNAL=true and tenant consent. Current Claude models think
  # before answering and thinking uses output tokens, so keep max_output_tokens generous. Model name is an example.
  - name: claude-sonnet
    provider: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    external: true
    structured_output: auto        # json_schema (output_config.format), then prompt-only JSON
    timeout_seconds: 60
    max_input_chars: 24000
    max_output_tokens: 4000
    max_retries: 2
    execution: inline
    pricing_provider: anthropic
    daily_token_cap: 200000
