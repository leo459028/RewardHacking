<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reward Guardrail Dashboard{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18202a;
      --muted: #667085;
      --line: #d9dee7;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --danger: #b42318;
      --warning: #b54708;
      --ok: #027a48;
      --queued: #344054;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    a { color: inherit; text-decoration: none; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
    .sidebar {
      background: #17202b;
      color: #eef4f3;
      padding: 22px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { font-size: 18px; font-weight: 700; line-height: 1.2; margin-bottom: 24px; }
    .brand span { display: block; color: #9fb7b4; font-size: 12px; font-weight: 600; margin-top: 4px; }
    .nav { display: grid; gap: 6px; }
    .nav a {
      border-radius: 6px;
      color: #cdd7d6;
      display: block;
      font-size: 14px;
      padding: 10px 12px;
    }
    .nav a.active, .nav a:hover { background: #23313e; color: #ffffff; }
    main { padding: 26px 30px 40px; }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    h1 { font-size: 26px; margin: 0; line-height: 1.2; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .title-note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }
    .heading-note {
      color: var(--muted);
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 3px;
      text-transform: none;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .stat, .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .stat { padding: 14px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 28px; font-weight: 750; margin-top: 6px; }
    .panel { padding: 18px; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .status {
      border-radius: 999px;
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
    }
    .status.completed { background: #ecfdf3; color: var(--ok); }
    .status.escalated, .status.queued, .status.awaiting_approval { background: #fffaeb; color: var(--warning); }
    .status.running { background: #eef4ff; color: #3538cd; }
    .status.denied, .status.failed { background: #fef3f2; color: var(--danger); }
    .flag {
      background: #eef4ff;
      border-radius: 999px;
      color: #3538cd;
      display: inline-block;
      font-size: 12px;
      margin: 0 4px 4px 0;
      padding: 3px 7px;
    }
    .button {
      background: var(--brand);
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      display: inline-flex;
      font-weight: 700;
      min-height: 36px;
      align-items: center;
      padding: 8px 12px;
    }
    .button.secondary { background: #344054; }
    .button.danger { background: var(--danger); }
    .button:hover { background: var(--brand-dark); }
    .inline-form { align-items: end; display: flex; gap: 10px; flex-wrap: wrap; }
    .inline-form input { min-width: 220px; }
    .filters, .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    label { color: var(--muted); display: grid; font-size: 12px; font-weight: 700; gap: 6px; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      min-height: 36px;
      padding: 8px 10px;
      width: 100%;
    }
    textarea { min-height: 132px; resize: vertical; }
    .checks { align-items: center; display: grid; gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 14px 0; }
    .checks label { align-items: center; display: flex; gap: 7px; }
    .checks input { min-height: auto; width: auto; }
    .checkline { align-items: center; display: flex; gap: 8px; padding-top: 24px; }
    .checkline input { min-height: auto; width: auto; }
    pre {
      background: #111827;
      border-radius: 8px;
      color: #e5e7eb;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
    }
    .detail-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .error { background: #fef3f2; border: 1px solid #fecdca; border-radius: 8px; color: var(--danger); padding: 12px; }
    .decision-form { display: grid; gap: 8px; min-width: 220px; }
    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: static; }
      .stats, .filters, .form-grid, .checks, .detail-grid { grid-template-columns: 1fr; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Reward Guardrail<span>Operational Dashboard</span></div>
      <nav class="nav">
        <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/dashboard">Overview</a>
        <a class="{{ 'active' if active == 'runs' else '' }}" href="/dashboard/runs">Runs</a>
        <a class="{{ 'active' if active == 'approvals' else '' }}" href="/dashboard/approvals">Approvals</a>
        <a class="{{ 'active' if active == 'worker' else '' }}" href="/dashboard/worker">Worker</a>
        <a class="{{ 'active' if active == 'observability' else '' }}" href="/dashboard/observability">Observability</a>
        <a class="{{ 'active' if active == 'governance' else '' }}" href="/dashboard/governance">Governance</a>
        <a class="{{ 'active' if active == 'control-plane' else '' }}" href="/dashboard/control-plane">Control Plane</a>
        <a class="{{ 'active' if active == 'costs' else '' }}" href="/dashboard/costs">Costs</a>
        <a class="{{ 'active' if active == 'admin-finops' else '' }}" href="/dashboard/admin/finops/pricing">Admin FinOps</a>
        <a class="{{ 'active' if active == 'operations' else '' }}" href="/dashboard/operations">Operations</a>
        <a class="{{ 'active' if active == 'playground' else '' }}" href="/dashboard/playground">Playground</a>
        <a href="/docs">OpenAPI</a>
      </nav>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
